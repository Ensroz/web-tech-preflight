<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Etkinlik Ekle</title>
</head>
<body>


  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="index.html">Etkinlikler</a>
      <a href="etkinlik-detay.html">Detay</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">

    
      <label for="etkinlik-adi">Etkinlik Adı</label><br>
      <input type="text" id="etkinlik-adi" name="etkinlik_adi" size="40" required><br><br>

    
      <label for="kategori">Kategori</label><br>
      <select id="kategori" name="kategori" required>
        <option value="Seminer">Seminer</option>
        <option value="Atolye">Atölye</option>
        <option value="Konferans">Konferans</option>
      </select><br><br>

      
      <label for="tarih-saat">Tarih / Saat</label><br>
      <input type="datetime-local" id="tarih-saat" name="tarih_saat" required><br><br>

      
      <label for="aciklama">Açıklama</label><br>
      <textarea id="aciklama" name="aciklama" rows="4" cols="38"></textarea><br><br>

   
      <button type="submit">Kaydet</button>

    </form>
  </main>

</body>
</html>
