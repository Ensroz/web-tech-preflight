<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501082.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Etkinlik Ekle</h1>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html" class="active">Ekle</a>
        <a href="etkinlik-guncelle.html">Güncelle</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-card">
      <form action="#" method="POST">
        <div class="form-group">
          <label for="ad">Etkinlik adı</label>
          <input type="text" id="ad" name="ad">
        </div>

        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz ▾</option>
            <option value="seminer">Seminer</option>
            <option value="atolye">Atölye</option>
            <option value="soylesi">Söyleşi</option>
          </select>
        </div>

        <!-- Hatalı / boş bırakılmış alan örneği (kırmızı kenarlık) -->
        <div class="form-group">
          <label for="tarih">Tarih</label>
          <input type="text" id="tarih" name="tarih" class="is-invalid" placeholder="boş bırakıldı">
        </div>

        <div class="form-group">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-submit">Kaydet</button>
      </form>
    </div>
  </main>
</body>
</html>
